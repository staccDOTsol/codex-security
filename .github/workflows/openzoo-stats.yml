name: openzoo aggregate

# THE NETWORK AGGREGATE, not this repo's own run.
#
# The split is deliberate:
#   this workflow          → publish-aggregate.mjs → AGGREGATE.md  (public HTTPS,
#                            so a hosted runner can reach it on a schedule)
#   openzoo/watch-and-publish.sh → publish-stats.mjs → STATS.md    (localhost proxy
#                            + local scan output, so it only works on the scanning
#                            machine)
#
# Cronning the personal one here would publish a table of dashes every 15
# minutes: a GitHub runner reaches neither 127.0.0.1:8402 nor a scan directory
# on someone's laptop.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  # Overlapping runs would race on the same two files and one push would lose.
  group: openzoo-aggregate
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Refresh network aggregate
        env:
          OPENZOO_STATS_URL: ${{ vars.OPENZOO_STATS_URL || 'https://x402-tokens.fly.dev/v1/stats' }}
        run: node openzoo/publish-aggregate.mjs

      - name: Commit if changed
        run: |
          git config user.name  "openzoo-stats"
          git config user.email "stats@openzoo.fun"
          git add AGGREGATE.md openzoo/aggregate.svg
          # `diff --cached --quiet` exits 1 when something IS staged, so a
          # no-change run must not fail the job.
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "aggregate: refresh network stats"
            # A scheduled job can race a human push; rebase rather than fail.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
